<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVM Labs – Reel card (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  html,body{margin:0;padding:0;background:#E9E8F2;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:#16133A;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 0}
  button{font-family:inherit}

  /* Icons: lucide / simple-icons via CSS mask, coloured with currentColor */
  .i{display:inline-block;flex:none;width:var(--s,18px);height:var(--s,18px);background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}
  .i-clock{--u:url("https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/icons/clock.svg")}
  .i-plus{--u:url("https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/icons/plus.svg")}
  .i-share{--u:url("https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/icons/share-2.svg")}
  .i-list{--u:url("https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/icons/list.svg")}
  .i-x{--u:url("https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/icons/x.svg")}
  .i-wa{--u:url("https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/whatsapp.svg")}

  /* Profile colour (hue 275 = Essential Wellness). Change --h to recolour the card. */
  .reel{--h:275;position:relative;width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(22,19,58,.35);
    background:radial-gradient(70% 50% at 100% 0%, oklch(0.93 0.05 var(--h) / 0.9), transparent 70%), linear-gradient(170deg,#FFFFFF 0%,#F7F6FC 100%)}
  .sym{position:absolute;right:-30px;top:18%;font-size:300px;font-weight:800;letter-spacing:-0.06em;color:rgba(59,44,158,0.06);line-height:1;pointer-events:none}

  /* Profile photo: top 62% of the card, fading out into the background */
  .photo{position:absolute;left:0;right:0;top:0;height:62%;pointer-events:none;background:var(--img) center/cover no-repeat;
    -webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 100%);mask-image:linear-gradient(180deg,#000 45%,transparent 100%)}

  .top{position:absolute;top:0;left:0;right:0;z-index:4;padding:12px 14px 0;display:flex;flex-direction:column;gap:10px}
  .dots{display:flex;justify-content:center;gap:6px;padding:6px 0}
  .pos{display:flex;align-items:center;gap:8px;height:36px;padding-right:52px}
  .pos span{white-space:nowrap;font-size:12.5px;font-weight:700;color:#5D5A7A}
  .dots span{height:7px;width:7px;border-radius:999px;background:#D4D1E6}
  .dots span.on{width:22px;background:#3B2C9E}
  .close{position:absolute;top:24px;right:12px;z-index:6;width:40px;height:40px;border-radius:999px;border:1px solid #E7E6F0;background:#fff;color:#16133A;display:grid;place-items:center;cursor:pointer}

  .body{position:absolute;inset:0;padding:84px 76px 150px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{white-space:nowrap;height:28px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid #E7E6F0;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
  .count{display:flex;align-items:flex-end;gap:10px}
  .count b{font-size:96px;font-weight:800;line-height:.85;letter-spacing:-0.05em}
  .count span{font-size:14px;font-weight:600;color:#5D5A7A;padding-bottom:8px;line-height:1.25}
  h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:1.05}
  p{margin:0;font-size:15px;line-height:1.5;color:#5D5A7A}
  .ideal{display:flex;gap:6px;flex-wrap:wrap}
  .ideal span{white-space:nowrap;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid #E7E6F0}

  .rail{position:absolute;right:10px;bottom:168px;z-index:4;display:flex;flex-direction:column;gap:16px;align-items:center}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;color:#16133A;cursor:pointer;font-size:11px;font-weight:700;padding:0}
  .rail button > span{width:48px;height:48px;border-radius:999px;background:#fff;border:1px solid #E7E6F0;display:grid;place-items:center}

  .bar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:40px 16px 24px;display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,rgba(246,246,250,0) 0%,rgba(246,246,250,0.97) 45%)}
  .price{display:flex;flex-direction:column;gap:2px;min-width:0}
  .price .row{display:flex;align-items:center;gap:8px}
  .mrp{font-size:13px;color:#5D5A7A;text-decoration:line-through}
  .off{white-space:nowrap;font-size:11.5px;font-weight:800;color:#0B3B26;background:#7BE3B4;padding:2px 8px;border-radius:999px}
  .now{font-size:26px;font-weight:800;letter-spacing:-0.02em}
  .book{flex:1;height:54px;border-radius:999px;border:none;cursor:pointer;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(180deg,#22B463,#138A47);box-shadow:0 12px 30px -10px rgba(19,138,71,0.8),inset 0 1px 0 rgba(255,255,255,0.25)}
</style>
</head>
