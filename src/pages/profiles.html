<main style="max-width:1280px;margin:0 auto;padding:clamp(18px,3vw,36px) clamp(14px,3vw,28px) 24px">
  <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:18px">
    <div style="display:flex;flex-direction:column;gap:6px;max-width:620px"><span style="font-size:13px;color:#5D5A7A;font-weight:600">Home / Profiles</span><h1 style="margin:0;font-size:clamp(28px,3.6vw,44px);font-weight:800;letter-spacing:-0.035em">Health profiles</h1><span style="font-size:15px;line-height:1.55;color:#5D5A7A">Curated bundles of tests — more insight, and a much lower price than booking each test separately.</span></div>
    <button onClick="{{ openReels0 }}" style="white-space:nowrap;height:50px;padding:0 20px 0 8px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#1C1650,#3B2C9E 70%,#5B46D6);color:#fff;font-size:15px;font-weight:800;box-shadow:0 14px 30px -14px rgba(59,44,158,0.8)"><span style="width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,0.18);display:grid;place-items:center"><avm-i n="play" s="15"></avm-i></span>Explore as reels</button>
  </div>
  <div style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 18px">
    <sc-for list="{{ profFilters }}" as="f" hint-placeholder-count="6"><button onClick="{{ f.go }}" style="flex:none;height:40px;padding:0 16px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:700;white-space:nowrap;border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }}">{{ f.label }}</button></sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px">
    <sc-for list="{{ profilesView }}" as="p" hint-placeholder-count="6">
      <div style="background:#fff;border:1px solid #ECEBF3;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s" style-hover="box-shadow:0 24px 50px -28px rgba(42,31,122,0.4);transform:translateY(-2px)">
        <div style="position:relative;padding:20px 20px 18px;background:{{ p.soft }};overflow:hidden;display:flex;flex-direction:column;gap:10px">
          <div style="position:absolute;top:0;right:0;bottom:0;width:62%;z-index:0;-webkit-mask-image:linear-gradient(to left,#000 35%,transparent 100%);mask-image:linear-gradient(to left,#000 35%,transparent 100%)"><image-slot id="{{ p.slotId }}" src="{{ p.photoSrc }}" credit="{{ p.photoCredit }}" credit-href="{{ p.photoHref }}" shape="rect" placeholder="Drop profile image" style="display:block;width:100%;height:100%"></image-slot></div>
          <div style="position:absolute;inset:0;z-index:1;pointer-events:none;background:{{ p.veil }}"></div>
          <span style="white-space:nowrap;align-self:flex-start;height:26px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.95);display:inline-flex;align-items:center;font-size:12px;font-weight:700;color:{{ p.ink }};position:relative;z-index:2">{{ p.tag }}</span>
          <h3 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;position:relative;z-index:2;max-width:78%">{{ p.name }}</h3>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#4A4766;position:relative;z-index:2;max-width:78%;text-wrap:pretty">{{ p.tagline }}</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;position:relative;z-index:2"><span style="padding:4px 10px;border-radius:999px;background:rgba(255,255,255,0.85)">{{ p.params }} parameters</span><span style="padding:4px 10px;border-radius:999px;background:rgba(255,255,255,0.85)">{{ p.fastLabel }}</span></div>
        </div>
        <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;flex:1">
          <div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ p.preview }}" as="x" hint-placeholder-count="3"><span style="white-space:nowrap;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:#F5F5FA;border:1px solid #ECEBF3">{{ x }}</span></sc-for><sc-if value="{{ p.hasMore }}"><button onClick="{{ p.open }}" style="font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:#EFEDFB;border:none;color:#3B2C9E;cursor:pointer">{{ p.moreLabel }}</button></sc-if></div>
          <div style="margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
            <div style="display:flex;flex-direction:column;gap:6px"><span style="white-space:nowrap;font-size:32px;font-weight:800;letter-spacing:-0.03em;line-height:1">{{ p.priceNum }}<small data-cur="1">{{ p.priceCur }}</small></span><span data-offer-pill="1">Offer price</span></div>
            <button onClick="{{ p.open }}" style="border:none;background:none;color:#3B2C9E;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 0"><avm-i n="play" s="13"></avm-i>View details</button>
          </div>
          <div style="display:flex;gap:8px">
            <sc-if value="{{ p.inCart }}"><button onClick="{{ p.toggle }}" style="flex:1;height:46px;border-radius:999px;border:none;background:#3B2C9E;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer"><avm-i n="check" s="16"></avm-i>Added</button></sc-if>
            <sc-if value="{{ p.notInCart }}"><button onClick="{{ p.toggle }}" aria-label="Add {{ p.name }} to cart" style="flex:1;height:46px;border-radius:999px;border:1.5px solid #3B2C9E;background:#fff;color:#3B2C9E;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer" style-hover="background:#EFEDFB"><avm-i n="plus" s="16"></avm-i>Add to cart</button></sc-if>
            <button onClick="{{ p.book }}" style="flex:1;height:46px;border-radius:999px;border:none;background:linear-gradient(180deg,#1FAD5E,#138A47);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,0.25)"><avm-i n="whatsapp" s="16"></avm-i>Book now</button>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</main>
