<section style="max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(14px,3vw,28px) 0">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0;border-radius:clamp(24px,3vw,34px);overflow:hidden;background:#fff;border:1px solid #ECEBF3;box-shadow:0 20px 50px -34px rgba(22,19,58,0.35)">
    <div style="position:relative;grid-column:1/-1;padding:clamp(20px,3vw,30px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 32px;align-items:center;color:#16133A">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="align-self:flex-start;white-space:nowrap;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:#FDECEC;border:none;font-size:12.5px;font-weight:700;color:#C81E25"><avm-i n="map-pin" s="14"></avm-i><span>{{ centreCount }} countries</span></span>
        <h2 style="margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-0.03em;line-height:1.12;text-wrap:balance">Step into an AVM Labs centre</h2>
        <p style="margin:0;font-size:14.5px;line-height:1.55;color:#5D5A7A;max-width:400px;text-wrap:pretty">Clean, calm collection rooms and trained staff — wherever you are.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;justify-self:end;margin-left:auto">
        <div style="position:relative;height:48px;border-radius:999px;border:1px solid rgba(59,44,158,0.14);background:linear-gradient(180deg,#FFFFFF 0%,#F6F4FE 100%);box-shadow:0 10px 24px -16px rgba(42,31,122,0.45),inset 0 1px 0 #fff;overflow:hidden">
          <div style="display:flex;flex-direction:column;transform:{{ centreY }};transition:transform .6s cubic-bezier(.65,0,.25,1)">
            <sc-for list="{{ centreRows }}" as="c" hint-placeholder-count="4"><div style="height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 7px"><span style="width:38px;height:30px;border-radius:999px;background:linear-gradient(135deg,#4B3CC4,#2A1F7A);box-shadow:0 4px 10px -4px rgba(59,44,158,0.6);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none">{{ c.code }}</span><span style="flex:1;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-0.01em;color:#16133A;white-space:nowrap">{{ c.name }}</span><span style="width:32px;height:32px;border-radius:999px;background:#EFEDFB;color:#3B2C9E;display:grid;place-items:center;flex:none"><avm-i n="map-pin" s="15"></avm-i></span></div></sc-for>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:6px"><sc-for list="{{ centreRows }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.go }}" aria-label="{{ c.name }}" style="border:none;padding:4px 2px;background:none;cursor:pointer;display:grid;place-items:center"><span style="display:block;height:6px;width:{{ c.dotW }};border-radius:999px;background:{{ c.dotBg }};transition:width .3s,background .3s"></span></button></sc-for></div>
      </div>
    </div>
    
  <div style="grid-column:1/-1;padding:0 0 clamp(18px,2.5vw,24px);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)">
      <div style="display:flex;gap:14px;width:max-content;animation:avmMarquee 80s linear infinite;will-change:transform" style-hover="animation-play-state:paused">
        <sc-for list="{{ centreShots }}" as="c" hint-placeholder-count="10"><div data-centre-tile="1" style="flex:none;width:clamp(180px,19vw,230px);aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#F4F2FC 0%,#E9E6F7 100%);border:1px solid rgba(59,44,158,0.08)"><image-slot id="{{ c.id }}" src="{{ c.photoSrc }}" credit="{{ c.photoCredit }}" credit-href="{{ c.photoHref }}" shape="rect" placeholder="{{ c.ph }}" style="display:block;width:100%;height:100%"></image-slot></div></sc-for>
      </div>
    </div>
  </div>
</section>
