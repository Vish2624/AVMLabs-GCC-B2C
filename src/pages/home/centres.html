<section style="max-width:1280px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(14px,3vw,28px) 0">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:0;border-radius:clamp(24px,3vw,34px);overflow:hidden;background:#fff;border:1px solid #ECEBF3;box-shadow:0 20px 50px -34px rgba(22,19,58,0.35)">
    <div style="position:relative;grid-column:1/-1;padding:clamp(20px,3vw,30px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 32px;align-items:center;color:#16133A">
      <div style="display:flex;flex-direction:column;gap:10px">
        <h2 style="margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-0.03em;line-height:1.12;text-wrap:balance">Step into an AVM Labs centre</h2>
        <p style="margin:0;font-size:14.5px;line-height:1.55;color:#5D5A7A;max-width:400px;text-wrap:pretty">Clean, calm collection rooms and trained staff — wherever you are.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;justify-self:end;margin-left:auto">
        <div style="position:relative;height:56px;border-radius:999px;border:1px solid rgba(59,44,158,0.14);background:linear-gradient(180deg,#FFFFFF 0%,#F6F4FE 100%);box-shadow:0 10px 24px -16px rgba(42,31,122,0.45),inset 0 1px 0 #fff;overflow:hidden">
          <div style="display:flex;flex-direction:column;transform:{{ centreY }};transition:transform .6s cubic-bezier(.65,0,.25,1)">
            <sc-for list="{{ centreRows }}" as="c" hint-placeholder-count="4"><div style="height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 7px 0 8px"><span style="width:40px;height:32px;border-radius:999px;background:linear-gradient(135deg,#4B3CC4,#2A1F7A);box-shadow:0 4px 10px -4px rgba(59,44,158,0.6);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none">{{ c.code }}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:14.5px;font-weight:800;letter-spacing:-0.01em;color:#16133A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.name }}</span><span style="font-size:12px;font-weight:500;color:#5D5A7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.address }}</span></span><button onClick="{{ c.map }}" aria-label="Directions to {{ c.name }}" style="width:38px;height:38px;border-radius:999px;border:none;background:#EFEDFB;color:#3B2C9E;display:grid;place-items:center;flex:none;cursor:pointer;transition:background .2s" style-hover="background:#E2DEFA"><avm-i n="map-pin" s="16"></avm-i></button></div></sc-for>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:0"><sc-for list="{{ centreRows }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.go }}" aria-label="{{ c.name }}" style="border:none;padding:9px 6px;min-width:24px;background:none;cursor:pointer;display:grid;place-items:center"><span style="display:block;height:6px;width:{{ c.dotW }};border-radius:999px;background:{{ c.dotBg }};transition:width .3s,background .3s"></span></button></sc-for></div>
      </div>
    </div>
    
  <div data-centre-strip="1" style="grid-column:1/-1;padding:46px 0 clamp(44px,5vw,56px);overflow:hidden">
      <div style="display:flex;gap:44px;padding-right:44px;width:max-content;animation:avmMarquee 51s linear infinite;will-change:transform" style-hover="animation-play-state:paused">
        <sc-for list="{{ centreShots }}" as="c" hint-placeholder-count="10"><div data-centre-tile="1" style="flex:none;width:clamp(180px,19vw,230px);aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#F4F2FC 0%,#E9E6F7 100%);border:1px solid rgba(59,44,158,0.08);transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;transform:translateZ(0)"><image-slot id="{{ c.id }}" src="{{ c.photoSrc }}" credit="{{ c.photoCredit }}" credit-href="{{ c.photoHref }}" shape="rect" placeholder="{{ c.ph }}" style="display:block;width:100%;height:100%"></image-slot></div></sc-for>
      </div>
    </div>
  </div>
</section>
