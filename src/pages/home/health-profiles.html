<section style="max-width:1280px;margin:0 auto;padding:clamp(24px,4vw,48px) clamp(14px,3vw,28px) 0">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#C81E25">Swipe to discover</span>
      <h2 style="margin:0;font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-0.03em;line-height:1.15;min-width:0;flex:1 1 auto;text-wrap:balance">Health profiles</h2>
      <p style="margin:0;font-size:15px;color:#5D5A7A">Swipe up for the next profile, swipe left to see every test inside.</p>
    </div>
    <button onClick="{{ goProfiles }}" style="white-space:nowrap;height:42px;padding:0 16px;border-radius:999px;border:1px solid #E7E6F0;background:#fff;color:#16133A;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px">All profiles<avm-i n="arrow-right" s="15"></avm-i></button>
  </div>
  <div style="position:relative"><div data-tile-row="1" style="display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 12px">
    <sc-for list="{{ reelTiles }}" as="p" hint-placeholder-count="6">
      <button onClick="{{ p.open }}" style="flex:0 0 clamp(150px,17vw,196px);aspect-ratio:9/16;border-radius:22px;border:none;cursor:pointer;position:relative;overflow:hidden;background:{{ p.bg }};color:#fff;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;box-shadow:0 20px 40px -26px rgba(22,19,58,0.7);transition:transform .25s" style-hover="transform:translateY(-3px)">
        <span style="position:absolute;inset:0;pointer-events:none"><image-slot id="{{ p.slotId }}" shape="rect" placeholder="" style="display:block;width:100%;height:100%"></image-slot></span>
        <span style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,11,43,0.35) 0%,rgba(14,11,43,0.05) 30%,rgba(14,11,43,0.55) 60%,rgba(14,11,43,0.92) 100%)"></span>
        <span style="position:absolute;right:-14px;top:30%;font-size:130px;font-weight:800;letter-spacing:-0.06em;color:rgba(255,255,255,0.08);line-height:1;pointer-events:none">{{ p.sym }}</span>
        <span style="display:flex;justify-content:space-between;align-items:center;position:relative"><span style="white-space:nowrap;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.22);display:inline-flex;align-items:center;font-size:11px;font-weight:700">{{ p.tag }}</span><span style="width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,0.18);display:grid;place-items:center"><avm-i n="play" s="12"></avm-i></span></span>
        <span style="display:flex;flex-direction:column;gap:6px;position:relative">
          <span style="font-size:38px;font-weight:800;letter-spacing:-0.05em;line-height:.9">{{ p.params }}</span>
          <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.8);margin-top:-2px">parameters</span>
          <span style="font-size:15px;font-weight:800;line-height:1.2;letter-spacing:-0.01em">{{ p.name }}</span>
          <span style="display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px"><span style="white-space:nowrap;font-size:13.5px;font-weight:800;color:#fff">{{ p.priceF }}</span><span style="white-space:nowrap;font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.7);text-decoration:line-through">{{ p.mrpF }}</span></span>
        </span>
      </button>
    </sc-for>
  </div><sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><button onClick="{{ tileNext }}" aria-label="More profiles" style="position:absolute;right:-10px;top:calc(50% - 26px);width:44px;height:44px;border-radius:999px;border:1px solid #E7E6F0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);color:#16133A;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px -10px rgba(22,19,58,0.4)"><avm-i n="chevron-right" s="20"></avm-i></button></sc-if></div>
</section>
