<section style="max-width:1280px;margin:0 auto;padding:clamp(28px,4vw,52px) clamp(14px,3vw,28px) 0">
  <h2 style="margin:0 0 18px;font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-0.03em;line-height:1.15;text-wrap:balance">Most booked tests</h2>
  <div style="display:{{ rowDisplay }};grid-template-columns:repeat(auto-fill,minmax(min(100%,max(300px,calc((100% - 32px) / 3))),1fr));gap:16px;overflow-x:{{ rowOverflow }};scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px">
    <sc-for list="{{ popular }}" as="t" hint-placeholder-count="4">
      <div onClick="{{ t.open }}" style="cursor:pointer;flex:0 0 min(82%,320px);scroll-snap-align:start;background:{{ t.cardBg }};border:1px solid rgba(59,44,158,0.16);border-radius:22px;padding:20px 20px 10px;display:flex;flex-direction:column;gap:18px;box-shadow:0 1px 3px rgba(22,19,58,0.07),0 12px 28px -16px rgba(42,31,122,0.32);transition:box-shadow .25s,transform .25s,border-color .25s" style-hover="box-shadow:0 2px 4px rgba(22,19,58,0.04),0 24px 46px -24px rgba(59,44,158,0.5);transform:translateY(-3px);border-color:rgba(59,44,158,0.22)">
        <h3 style="margin:0;font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-0.015em;color:#16133A;text-wrap:pretty;min-height:2.6em;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ t.name }}</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto">
          <div style="display:flex;align-items:center;gap:10px"><span style="width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#F3F1FE 0%,#E5E0FA 100%);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px rgba(59,44,158,0.35);color:#3B2C9E;display:grid;place-items:center;flex:none"><avm-i n="test-tubes" s="19"></avm-i></span><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8A8698">Includes</span><span style="white-space:nowrap;font-size:15px;font-weight:700;color:#16133A;line-height:1.2">{{ t.paramsCap }}</span></span></div>
          <div style="display:flex;align-items:center;gap:10px"><span style="width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#F3F1FE 0%,#E5E0FA 100%);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px rgba(59,44,158,0.35);color:#3B2C9E;display:grid;place-items:center;flex:none"><avm-i n="clock-3" s="19"></avm-i></span><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8A8698">Reports in</span><span style="white-space:nowrap;font-size:15px;font-weight:700;color:#16133A;line-height:1.2">{{ t.tatH }}</span></span></div>
        </div>
        <div data-price-strip="1" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px 9px 14px;border-radius:18px">
          <div style="display:flex;flex-direction:column;gap:6px;flex:none">
            <span style="white-space:nowrap;display:flex;align-items:baseline;gap:4px;color:#16133A;line-height:1"><b style="font-size:33px;font-weight:800;letter-spacing:-0.03em">{{ t.priceNum }}</b><small style="font-size:14px;font-weight:700;letter-spacing:.02em">{{ t.priceCur }}</small></span>
            <span data-offer-pill="1">Offer price</span>
          </div>
          <sc-if value="{{ t.notInCart }}"><button onClick="{{ t.toggle }}" aria-label="Add {{ t.name }} to cart" style="white-space:nowrap;height:46px;padding:0 26px;border-radius:999px;border:1.5px solid #3B2C9E;background:#fff;color:#3B2C9E;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 14px -10px rgba(59,44,158,0.7);transition:background .2s" style-hover="background:#EFEDFB"><avm-i n="plus" s="17"></avm-i>Add</button></sc-if>
          <sc-if value="{{ t.covered }}"><span onClick="{{ t.stop }}" title="{{ t.coveredBy }}" style="max-width:170px;min-height:46px;padding:5px 16px 5px 12px;border-radius:999px;border:1.5px solid #BFE8D2;background:#EAF7EF;color:#0E7350;display:flex;align-items:center;gap:8px;cursor:default"><avm-i n="circle-check" s="18"></avm-i><span style="display:flex;flex-direction:column;min-width:0;line-height:1.15"><b style="font-size:14px;font-weight:800">Included</b><small style="font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.coveredBy }}</small></span></span></sc-if>
          <sc-if value="{{ t.inCart }}"><button onClick="{{ t.toggle }}" aria-label="Remove {{ t.name }} from cart" style="white-space:nowrap;height:46px;padding:0 22px;border-radius:999px;border:1.5px solid #3B2C9E;background:linear-gradient(180deg,#4B3CC4,#3B2C9E);color:#fff;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 18px -10px rgba(59,44,158,0.85)"><avm-i n="check" s="17"></avm-i>Added</button></sc-if>
        </div>
        <div style="min-height:16px;margin-top:-12px"><sc-if value="{{ t.underMin }}"><span data-min-note="1"><avm-i n="info" s="13"></avm-i>{{ t.minNote }}</span></sc-if></div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;justify-content:center;margin-top:12px">
    <button onClick="{{ goTests }}" style="white-space:nowrap;height:46px;padding:0 26px;border-radius:999px;border:1.5px solid #3B2C9E;background:#fff;color:#3B2C9E;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .2s" style-hover="background:#EFEDFB">View more<avm-i n="arrow-right" s="17"></avm-i></button>
  </div>
</section>
