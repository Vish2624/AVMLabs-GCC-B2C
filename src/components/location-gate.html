<div style="position:fixed;inset:0;z-index:400;background:rgba(22,19,58,0.22);backdrop-filter:blur(12px) saturate(130%);-webkit-backdrop-filter:blur(12px) saturate(130%);display:flex;align-items:center;justify-content:center;padding:20px">
  <div role="dialog" aria-modal="true" style="width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:22px 20px 18px;border-radius:26px;background:rgba(255,255,255,0.62);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.75);box-shadow:0 30px 70px -28px rgba(22,19,58,0.55),inset 0 1px 0 rgba(255,255,255,0.9)">
    <sc-if value="{{ gateMain }}" hint-placeholder-val="{{ true }}">
    <span style="width:52px;height:52px;border-radius:999px;background:rgba(224,34,42,0.12);color:#E0222A;display:grid;place-items:center"><avm-i n="{{ gateIcon }}" s="24"></avm-i></span>
    <div style="display:flex;flex-direction:column;gap:4px">
      <h1 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-0.02em;line-height:1.25;color:#16133A;text-wrap:balance">{{ gateTitle }}</h1>
      <p style="margin:0;font-size:13.5px;line-height:1.5;color:#4A4766;text-wrap:pretty">{{ gateText }}</p>
    </div>
    <sc-if value="{{ gateCanRetry }}"><button onClick="{{ relocate }}" style="white-space:nowrap;width:100%;height:46px;border-radius:999px;border:none;background:linear-gradient(180deg,#4B3CC4,#3B2C9E);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 12px 26px -12px rgba(59,44,158,0.7)"><avm-i n="locate-fixed" s="17"></avm-i>{{ gateBtn }}</button></sc-if>
    <sc-if value="{{ gateBusy }}"><div style="width:100%;height:46px;border-radius:999px;background:rgba(239,237,251,0.9);color:#3B2C9E;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ gateBtn }}</div></sc-if>
    <button onClick="{{ openPick }}" style="white-space:nowrap;border:none;background:none;color:#3B2C9E;font-size:13.5px;font-weight:700;cursor:pointer;padding:4px 8px">Continue without location</button>
    </sc-if>
    <sc-if value="{{ gatePick }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;display:flex;align-items:center;gap:8px">
      <button onClick="{{ closePick }}" aria-label="Back" style="width:34px;height:34px;border-radius:999px;border:1px solid rgba(22,19,58,0.08);background:rgba(255,255,255,0.7);color:#16133A;display:grid;place-items:center;cursor:pointer;flex:none"><avm-i n="arrow-left" s="16"></avm-i></button>
      <h1 style="margin:0;flex:1;font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#16133A;text-align:left">Select your country</h1>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ countryOpts }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" style="width:100%;height:50px;padding:0 14px;border-radius:16px;border:1px solid rgba(255,255,255,0.85);background:rgba(255,255,255,0.72);color:#16133A;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;box-shadow:0 4px 14px -8px rgba(22,19,58,0.25)" style-hover="background:#fff;border-color:#DAD5F7"><span style="width:34px;height:26px;border-radius:8px;background:#EFEDFB;color:#3B2C9E;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none">{{ c.code }}</span><span style="flex:1;font-size:15px;font-weight:700">{{ c.name }}</span><avm-i n="chevron-right" s="17"></avm-i></button></sc-for>
    </div>
    </sc-if>
  </div>
</div>
